name: Build Social Media Assets

# Builds a folder per month (social_media/{month}/) containing the top 10
# products (+ ties) by review count that month: product images plus a
# captions.json with name, seller, review count, and product URL for each —
# everything needed to put together an Instagram post without extra lookup.
#
# Runs across ALL months every time and skips any month that already has a
# captions.json, so it naturally backfills your historical backlog on first
# run, then only does new work each month after that.
#
# Deliberately a separate workflow from site-build-publish.yml — this only
# writes to social_media/, never to docs/, so it can never affect the live
# site even if a run here is slow or fails partway through.

on:
  schedule:
    - cron: '0 8 1 * *'   # 1st of the month, 08:00 UTC — after site-build-publish
  workflow_dispatch:        # trigger manually any time, e.g. to backfill

jobs:
  build-social-assets:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 Pillow

      - name: Build social media assets
        env:
          PYTHONUNBUFFERED: "1"
        run: python scripts/build_social_assets.py

      - name: Commit social media assets
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add social_media/
          timestamp=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          if ! git commit -m "Build social media assets for $timestamp"; then
            echo "No changes to commit"
            exit 0
          fi

          # main can move while this runs — on 1 Nov 2026 the site build
          # pushed 8 seconds before this did, and the whole October carousel
          # was rejected. This job only touches social_media/, so replaying
          # its commit on the new tip can't conflict: rebase and retry.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push attempt $attempt rejected; rebasing onto origin/main..."
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::Rebase onto origin/main failed; social assets not committed."
              exit 1
            fi
          done

          echo "::error::Could not push social assets after 3 attempts."
          exit 1
