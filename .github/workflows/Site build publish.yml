name: Site Build & Publish

# Rebuilds the site from whatever data already exists in data/ — it does NOT
# pull new data itself. Data collection is handled entirely separately by
# weekly-agent.yml, monthly-agent.yml, yearly-agent.yml, and all-agent.yml on
# their own schedules.
#
# Deliberately decoupled: this workflow just says "build the site from
# whatever's there right now." build_monthly_json.py scans ALL matching
# xlsx files in data/, not just the newest — so if a month was missed (e.g.
# June/July sitting unrendered), running this will catch it up automatically.
#
# Steps:
# 1. Rebuild monthly JSON from all xlsx files present
# 2. Top up the product cache with any new products found in the data
#    (NOTHS search only — some products won't resolve this way)
# 3. Second pass: recover still-unresolved products via Feefo (Selenium)
# 4. Build enriched monthly datasets (adds product/seller metadata from cache)
# 5. Build leaderboards (all-time / last-12-months product stats)
# 6. Render the /noths/ subpages and about-the-data page (render.py)
# 7. Render the homepage, archive, top-products, and about pages (render_site.py)
# 8. Commit — GitHub Pages serves trendlist.co.uk directly from this repo's
#    /docs folder, so this commit is the final step; no second repo involved.
#
# ORDER MATTERS: build_monthly_json.py is what writes data/monthly/index.json,
# and topup_products_cache.py reads that index to decide which SKUs to look up.
# This used to run the other way round, so the newest month's brand-new SKUs
# were never scraped — they landed in the site with no seller metadata and were
# all lumped together as a single fake "Unknown brand" partner topping the
# brand leaderboard. Do not move the top-up back above the JSON build.

on:
  schedule:
    - cron: '0 6 1 * *'   # 1st of the month, 06:00 UTC — well after the data-pull agents
  workflow_dispatch:        # lets you trigger it manually any time, e.g. to catch up

# The build takes a long time (the cache top-up scrapes every new SKU) and ends
# by committing to main. Two overlapping runs will therefore race each other to
# push, and the loser is rejected — throwing away a full rebuild. Queue them
# instead. cancel-in-progress stays false so an in-flight build always finishes.
concurrency:
  group: site-build-publish
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pandas openpyxl requests beautifulsoup4 jinja2 selenium

      # --- 1. Rebuild monthly JSON from all xlsx files present --------------
      # MUST run before the cache top-up: this writes data/monthly/index.json,
      # which the top-up reads to work out which SKUs need looking up.
      - name: Build monthly JSON
        run: python build_monthly_json.py

      # --- 2. Fill in missing product details (NOTHS search) ------------------
      - name: Top up product cache
        env:
          PYTHONUNBUFFERED: "1"
        run: python topup_products_cache.py

      # --- 3. Second pass: recover unresolved products via Feefo (Selenium) --
      - name: Recover unresolved products via Feefo
        env:
          PYTHONUNBUFFERED: "1"
        run: python scripts/recover_cache_feefo_selenium.py

      # --- 4. Build enriched monthly datasets (needed by render_site.py) ----
      - name: Build enriched monthly data
        run: python scripts/build_enriched_monthly.py

      # --- 5. Build leaderboards (all-time / last-12-months product stats) --
      - name: Build leaderboards
        run: python scripts/build_leaderboards.py

      # --- 6. Render /noths/ subpages + about-the-data page ------------------
      - name: Render noths subpages
        run: python render.py

      # --- 7. Render homepage, archive, top-products, about ------------------
      - name: Render homepage and core pages
        run: python scripts/render_site.py

      # --- 8. Commit build output ---------------------------------------------
      - name: Commit build output
        run: |
          set -euo pipefail

          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add data/ docs/

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          timestamp=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          git commit -m "Site rebuild for $timestamp"

          # main can move while the build runs (a push from a laptop, or another
          # workflow committing). A bare `git push` is rejected in that case and
          # the whole rebuild is thrown away at the final step — which is exactly
          # what happened on 2026-08-02. Rebase onto the new tip and retry.
          #
          # -X theirs resolves conflicts in favour of the commit being replayed,
          # i.e. this build's output. That is correct here: everything under
          # data/ and docs/ is generated from the xlsx sources, so the freshly
          # built version always wins over whatever was there before.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi

            echo "Push attempt $attempt rejected; rebasing onto origin/main..."
            git fetch origin main

            if ! git rebase --strategy-option=theirs origin/main; then
              git rebase --abort || true
              echo "::error::Rebase onto origin/main failed; build output not published."
              exit 1
            fi
          done

          echo "::error::Could not push build output after 3 attempts."
          exit 1
